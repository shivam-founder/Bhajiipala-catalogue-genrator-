<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BhajiPala – WhatsApp Catalogue Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #052e16; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(74,222,128,0.3); border-radius: 10px; }
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    select option { background: #1a3a1a; color: #fff; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const CATEGORIES = [
      { id: "leafy",   label: "Leafy / पालेभाज्या",           emoji: "🥬" },
      { id: "veggies", label: "Vegetables / भाज्या",           emoji: "🍅" },
      { id: "fruits",  label: "Fruits / फळे",                  emoji: "🍋" },
      { id: "special", label: "Today's Special / आजचे स्पेशल", emoji: "🌟" },
    ];

    const UNIT_OPTIONS = ["kg", "bunch", "piece", "100g", "500g", "dozen"];

    const VEGETABLE_EMOJIS = {
      palak:"🥬", spinach:"🥬", methi:"🌿", fenugreek:"🌿",
      coriander:"🌿", kothi:"🌿", tomato:"🍅", onion:"🧅",
      kanda:"🧅", potato:"🥔", batata:"🥔", brinjal:"🍆",
      vangi:"🍆", capsicum:"🫑", bhendi:"💚", ladyfinger:"💚",
      chilli:"🌶️", mirchi:"🌶️", cucumber:"🥒", kakdi:"🥒",
      carrot:"🥕", gajar:"🥕", cabbage:"🥦", cauliflower:"🥦",
      lemon:"🍋", nimbu:"🍋", mango:"🥭", aam:"🥭",
      banana:"🍌", kela:"🍌", apple:"🍎", grapes:"🍇",
      default:"🌾"
    };

    function getVegEmoji(name) {
      const lower = name.toLowerCase().replace(/\s/g, "");
      for (const [key, emoji] of Object.entries(VEGETABLE_EMOJIS)) {
        if (key !== "default" && lower.includes(key)) return emoji;
      }
      return VEGETABLE_EMOJIS.default;
    }

    function generateMessage(settings, rows) {
      const { shopName, orderBy, deliveryTime, phone, date } = settings;
      const dateStr = date
        ? new Date(date).toLocaleDateString("en-IN", { day: "numeric", month: "long", year: "numeric" })
        : new Date().toLocaleDateString("en-IN", { day: "numeric", month: "long", year: "numeric" });

      let msg = `🌿 *${shopName} – आजचा भाजीपाला* 🌿\n`;
      msg += `📅 ${dateStr}\n`;
      msg += `⏰ Order by: ${orderBy}\n`;
      msg += `🚚 Delivery: ${deliveryTime}\n`;
      msg += `━━━━━━━━━━━━━━━━━━━\n\n`;

      const grouped = {};
      rows.forEach(row => {
        if (!row.name.trim() || !row.price.trim()) return;
        const cat = row.category || "veggies";
        if (!grouped[cat]) grouped[cat] = [];
        grouped[cat].push(row);
      });

      CATEGORIES.forEach(cat => {
        const items = grouped[cat.id];
        if (!items || items.length === 0) return;
        msg += `${cat.emoji} *${cat.label.toUpperCase()}*\n`;
        items.forEach(item => {
          const emoji = getVegEmoji(item.name);
          msg += `• ${emoji} ${item.name} – ₹${item.price}/${item.unit || "kg"}\n`;
        });
        msg += `\n`;
      });

      msg += `━━━━━━━━━━━━━━━━━━━\n`;
      msg += `✅ *ऑर्डर कसे करावे / How to Order:*\n`;
      msg += `Reply with:\n\n`;
      msg += `Name: (तुमचे नाव)\nAddress: (पत्ता)\nOrder:\n- Item 1\n- Item 2\n\n`;
      msg += `━━━━━━━━━━━━━━━━━━━\n`;
      msg += `🌾 Farm Fresh | Zero Middleman | Washim\n`;
      if (phone) msg += `📞 ${phone}`;

      return msg;
    }

    function App() {
      const [settings, setSettings] = useState({
        shopName: "BhajiPala",
        date: "",
        orderBy: "9:00 PM Tonight",
        deliveryTime: "Tomorrow 7–10 AM",
        phone: "",
      });

      const [rows, setRows] = useState([
        { id: 1, name: "", price: "", unit: "kg", category: "veggies" },
        { id: 2, name: "", price: "", unit: "kg", category: "veggies" },
        { id: 3, name: "", price: "", unit: "kg", category: "veggies" },
      ]);

      const [preview, setPreview] = useState("");
      const [generated, setGenerated] = useState(false);
      const [copied, setCopied] = useState(false);

      const addRow = () => {
        setRows(r => [...r, { id: Date.now(), name: "", price: "", unit: "kg", category: "veggies" }]);
      };

      const removeRow = (id) => setRows(r => r.filter(row => row.id !== id));

      const updateRow = (id, field, value) =>
        setRows(r => r.map(row => row.id === id ? { ...row, [field]: value } : row));

      const generate = () => {
        const msg = generateMessage(settings, rows);
        setPreview(msg);
        setGenerated(true);
      };

      const copy = async () => {
        await navigator.clipboard.writeText(preview);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      const sendWhatsApp = () => {
        window.open(`https://wa.me/?text=${encodeURIComponent(preview)}`, "_blank");
      };

      const inp = {
        background: "rgba(255,255,255,0.07)",
        border: "1px solid rgba(255,255,255,0.15)",
        borderRadius: "8px",
        color: "#fff",
        padding: "8px 12px",
        fontSize: "13px",
        outline: "none",
        width: "100%",
        fontFamily: "inherit",
      };

      const lbl = {
        fontSize: "11px", fontWeight: "700",
        letterSpacing: "0.08em", color: "#86efac",
        textTransform: "uppercase", marginBottom: "5px", display: "block",
      };

      const card = {
        background: "rgba(255,255,255,0.05)",
        borderRadius: "16px",
        border: "1px solid rgba(74,222,128,0.2)",
        padding: "18px",
      };

      const sectionTitle = {
        margin: "0 0 14px", fontSize: "12px", fontWeight: "800",
        letterSpacing: "0.1em", color: "#fbbf24", textTransform: "uppercase",
      };

      return (
        <div style={{
          minHeight: "100vh",
          background: "linear-gradient(135deg, #052e16 0%, #14532d 40%, #1a3a1a 100%)",
          fontFamily: "'Segoe UI', system-ui, sans-serif",
          color: "#fff",
          padding: "24px 16px",
        }}>
          {/* Header */}
          <div style={{ textAlign: "center", marginBottom: "28px" }}>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:"10px", marginBottom:"6px" }}>
              <span style={{ fontSize:"28px" }}>🌿</span>
              <h1 style={{ margin:0, fontSize:"26px", fontWeight:"800", letterSpacing:"-0.5px", color:"#4ade80" }}>BhajiPala</h1>
              <span style={{ fontSize:"28px" }}>🌿</span>
            </div>
            <p style={{ margin:0, color:"#86efac", fontSize:"13px", letterSpacing:"0.12em", textTransform:"uppercase" }}>
              WhatsApp Catalogue Generator
            </p>
          </div>

          <div style={{
            maxWidth: "960px", margin: "0 auto",
            display: "grid", gridTemplateColumns: "1fr 1fr", gap: "20px",
          }}>

            {/* ── LEFT PANEL ── */}
            <div style={{ display:"flex", flexDirection:"column", gap:"16px" }}>

              {/* Settings */}
              <div style={card}>
                <p style={sectionTitle}>📋 Catalogue Settings</p>
                <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"10px" }}>
                  {[
                    { key:"shopName",     label:"Shop Name" },
                    { key:"date",         label:"Date", type:"date" },
                    { key:"orderBy",      label:"Order By Time" },
                    { key:"deliveryTime", label:"Delivery Time" },
                    { key:"phone",        label:"Phone Number" },
                  ].map(({ key, label, type }) => (
                    <div key={key} style={{ gridColumn: key === "phone" ? "1 / -1" : "auto" }}>
                      <label style={lbl}>{label}</label>
                      <input
                        type={type || "text"}
                        value={settings[key]}
                        onChange={e => setSettings(s => ({ ...s, [key]: e.target.value }))}
                        style={inp}
                      />
                    </div>
                  ))}
                </div>
              </div>

              {/* Products */}
              <div style={{ ...card, flex: 1 }}>
                <p style={sectionTitle}>🥦 Add Products & Rates</p>

                {/* Column headers */}
                <div style={{ display:"grid", gridTemplateColumns:"2fr 1fr 1fr 1.4fr 28px", gap:"6px", marginBottom:"8px" }}>
                  {["Product Name","Price (₹)","Unit","Category",""].map((h,i) => (
                    <span key={i} style={{ ...lbl, marginBottom:0 }}>{h}</span>
                  ))}
                </div>

                <div style={{ display:"flex", flexDirection:"column", gap:"7px", maxHeight:"320px", overflowY:"auto", paddingRight:"4px" }}>
                  {rows.map(row => (
                    <div key={row.id} style={{ display:"grid", gridTemplateColumns:"2fr 1fr 1fr 1.4fr 28px", gap:"6px", alignItems:"center" }}>
                      <input
                        placeholder="e.g. Tomato (टोमॅटो)"
                        value={row.name}
                        onChange={e => updateRow(row.id, "name", e.target.value)}
                        style={inp}
                      />
                      <input
                        placeholder="30"
                        value={row.price}
                        onChange={e => updateRow(row.id, "price", e.target.value)}
                        style={inp}
                        type="number"
                      />
                      <select
                        value={row.unit}
                        onChange={e => updateRow(row.id, "unit", e.target.value)}
                        style={{ ...inp, cursor:"pointer" }}
                      >
                        {UNIT_OPTIONS.map(u => <option key={u} value={u}>{u}</option>)}
                      </select>
                      <select
                        value={row.category}
                        onChange={e => updateRow(row.id, "category", e.target.value)}
                        style={{ ...inp, cursor:"pointer", fontSize:"12px" }}
                      >
                        {CATEGORIES.map(c => (
                          <option key={c.id} value={c.id}>{c.emoji} {c.id}</option>
                        ))}
                      </select>
                      <button
                        onClick={() => removeRow(row.id)}
                        style={{ background:"rgba(239,68,68,0.2)", border:"none", borderRadius:"6px", color:"#f87171", cursor:"pointer", fontSize:"16px", width:"28px", height:"28px", display:"flex", alignItems:"center", justifyContent:"center" }}
                      >×</button>
                    </div>
                  ))}
                </div>

                <button
                  onClick={addRow}
                  style={{ marginTop:"12px", background:"rgba(74,222,128,0.1)", border:"1px dashed rgba(74,222,128,0.4)", borderRadius:"8px", color:"#4ade80", cursor:"pointer", padding:"8px", width:"100%", fontSize:"13px", fontWeight:"600" }}
                >
                  + Add Item
                </button>
              </div>

              {/* Generate Button */}
              <button
                onClick={generate}
                style={{
                  background:"linear-gradient(135deg,#16a34a,#4ade80)",
                  border:"none", borderRadius:"12px", color:"#052e16",
                  cursor:"pointer", padding:"14px", fontSize:"15px",
                  fontWeight:"800", letterSpacing:"0.05em",
                  boxShadow:"0 4px 20px rgba(74,222,128,0.35)",
                }}
              >
                🌿 Generate Catalogue
              </button>
            </div>

            {/* ── RIGHT PANEL ── */}
            <div style={{ display:"flex", flexDirection:"column", gap:"12px" }}>
              <div style={{
                ...card,
                flex: 1,
                border: `1px solid ${generated ? "rgba(74,222,128,0.35)" : "rgba(255,255,255,0.1)"}`,
                display:"flex", flexDirection:"column",
              }}>
                <p style={sectionTitle}>👁️ Preview</p>
                {generated ? (
                  <pre style={{
                    flex:1, margin:0,
                    fontFamily:"'Courier New', monospace",
                    fontSize:"12px", lineHeight:"1.75",
                    color:"#dcfce7", whiteSpace:"pre-wrap",
                    wordBreak:"break-word", overflowY:"auto",
                    maxHeight:"520px",
                  }}>
                    {preview}
                  </pre>
                ) : (
                  <div style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:"10px", opacity:0.4 }}>
                    <span style={{ fontSize:"44px" }}>🥦</span>
                    <p style={{ margin:0, fontSize:"13px", color:"#86efac", textAlign:"center" }}>
                      Fill in your products &<br />click Generate Catalogue
                    </p>
                  </div>
                )}
              </div>

              {/* Action Buttons */}
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"10px" }}>
                <button
                  onClick={copy}
                  disabled={!generated}
                  style={{
                    background: copied ? "rgba(74,222,128,0.2)" : "rgba(255,255,255,0.08)",
                    border: `1px solid ${copied ? "rgba(74,222,128,0.5)" : "rgba(255,255,255,0.15)"}`,
                    borderRadius:"10px", color: copied ? "#4ade80" : "#fff",
                    cursor: generated ? "pointer" : "not-allowed",
                    padding:"13px", fontSize:"14px", fontWeight:"700",
                    opacity: generated ? 1 : 0.4, transition:"all 0.2s",
                  }}
                >
                  {copied ? "✅ Copied!" : "📋 Copy Text"}
                </button>
                <button
                  onClick={sendWhatsApp}
                  disabled={!generated}
                  style={{
                    background: generated ? "linear-gradient(135deg,#25D366,#128C7E)" : "rgba(255,255,255,0.05)",
                    border:"none", borderRadius:"10px",
                    color: generated ? "#fff" : "#555",
                    cursor: generated ? "pointer" : "not-allowed",
                    padding:"13px", fontSize:"14px", fontWeight:"800",
                    boxShadow: generated ? "0 4px 16px rgba(37,211,102,0.35)" : "none",
                    transition:"all 0.2s",
                  }}
                >
                  💬 Send on WhatsApp
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
